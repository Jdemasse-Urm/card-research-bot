<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card Research Bot</title>
  <style>
    :root { --bg: #f4f2ee; --panel: #fff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e0da; --accent: #1f5eff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141416; --panel: #1d1d21; --ink: #f1f1f3; --muted: #9a9aa2; --line: #2e2e34; --accent: #5b8cff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
    form { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1.6rem; width: 100%; max-width: 340px; text-align: center; }
    h1 { font-size: 1.2rem; margin: 0 0 .3rem; }
    p { color: var(--muted); margin: 0 0 1rem; font-size: .9rem; }
    input { font: inherit; font-size: 1.4rem; letter-spacing: .3em; text-align: center; width: 100%; box-sizing: border-box; padding: .6rem; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
    button { margin-top: .9rem; width: 100%; font: inherit; font-weight: 600; padding: .7rem; border: none; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
    #msg { color: #c2341b; min-height: 1.4em; margin-top: .6rem; font-size: .9rem; }
  </style>
</head>
<body>
  <form id="f">
    <h1>◆ Card Research Bot</h1>
    <p>Enter the PIN set on the computer running the bot.</p>
    <input id="pin" inputmode="numeric" autocomplete="off" maxlength="8" autofocus aria-label="PIN" />
    <button>Unlock</button>
    <div id="msg" role="alert"></div>
  </form>
  <script src="/pin.js"></script>
</body>
</html>
